name: Release APK

# Same build as build.yml, but only for version tags / manual runs, and the APK is attached to a GitHub release.
# Set the repository secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS / ANDROID_KEY_PASS
# to keep one signing identity across releases (otherwise a throw-away key is created and the APK cannot be updated in place).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS: 34.0.0
  PLATFORM: android-34

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: ''     # the default 'tools platform-tools' no longer exists in current cmdline-tools; the next step installs what is needed
      - run: sdkmanager "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION"
      - name: Desktop tests
        run: |
          sudo apt-get update && sudo apt-get install -y g++ make python3-pil
          tools/run-host-tests.sh
      - name: Stockfish 19 for ARM64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          tools/build-stockfish-android.sh
      - name: APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS"
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/$PLATFORM/android.jar"
          tools/build-apk.sh
          tools/package-apk.sh
          tools/check-apk.sh build/out/ChessHintPanel-v*.apk
      - uses: actions/upload-artifact@v4
        with: { name: ChessHintPanel-apk, path: "build/out/ChessHintPanel-v*.apk" }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/out/ChessHintPanel-v*.apk
            build/jnilibs/engine-build-info.txt
