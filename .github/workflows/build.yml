name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot-test dependency
        run: python -m pip install pillow

      - name: Run desktop regression tests
        run: bash tools/test-desktop.sh


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 ndk;27.2.12479018'

      - name: Build Stockfish 19 for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          tools/build-stockfish-android.sh

      - name: Build APK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          tools/build-apk.sh
          tools/package-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHintPanel-apk
          path: build/out/*.apk
